services:
  db:
    image: pgvector/pgvector:pg16
    container_name: kai-mcp-empresa-db
    environment:
      POSTGRES_USER: kai
      POSTGRES_PASSWORD: kai
      POSTGRES_DB: kai_empresa
    ports:
      - "5433:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      # Applied only on first init (empty data dir). Ongoing changes → Atlas.
      - ./schema.sql:/docker-entrypoint-initdb.d/0001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kai -d kai_empresa"]
      interval: 3s
      timeout: 3s
      retries: 15
