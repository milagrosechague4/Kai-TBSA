name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      KAI_AUTH_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies (locked)
        run: uv sync --extra dev --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Tool catalog snapshot (anti tool-poisoning gate)
        run: uv run pytest tests/test_tool_catalog_snapshot.py -q

      - name: Tests
        run: uv run pytest -q
