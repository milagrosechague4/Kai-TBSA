[project]
name = "kai-mcp-empresa"
version = "0.1.0"
description = "Kai Layer 2 — per-tenant company MCP server (knowledge base + identity + audit over the company brain)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.2,<4",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
kai-mcp-empresa = "kai_mcp_empresa.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kai_mcp_empresa"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
